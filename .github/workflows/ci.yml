name: CI

# Pipeline d'intégration continue Track'N Share.
# Tous les gates sont bloquants : lint + build + tests (unitaires et e2e)
# sur api/web, typecheck + lint sur mobile.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les exécutions précédentes encore en cours sur une même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    # Environnement de tests multi-tiers (BC04-5) : conteneurs de service
    # PostgreSQL + Redis provisionnés pour les tests e2e.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracknshare
          POSTGRES_PASSWORD: tracknshare
          POSTGRES_DB: tracknshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracknshare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Lint (bloquant, zéro warning toléré) ---
      - name: Lint API
        run: pnpm --filter api lint:ci

      - name: Lint Web
        run: pnpm --filter web lint:ci

      # --- Build (bloquant) ---
      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

      # --- Tests (bloquant) ---
      - name: Test API (unitaires)
        run: pnpm --filter api test:ci

      - name: Test Web
        run: pnpm --filter web test:ci

      # --- Tests end-to-end API (bloquant) : parcours critique contre
      #     PostgreSQL + Redis réels (auth, sécurité chat, RGPD). ---
      - name: Test API (e2e)
        run: pnpm --filter api test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tracknshare
          DB_PASSWORD: tracknshare
          DB_NAME: tracknshare_test
          DB_SYNCHRONIZE: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: e2e-ci-jwt-secret-please-change
          MESSAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  # L'app mobile est volontairement hors workspace pnpm (contraintes Expo) :
  # elle est vérifiée dans un job dédié avec ses propres dépendances.
  mobile:
    name: Typecheck Mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (expo lint)
        run: npx expo lint
